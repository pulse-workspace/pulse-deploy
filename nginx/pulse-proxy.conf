# Nginx Reverse Proxy snippet for Pulse Platform
# Place this in your host's Nginx configuration (e.g., /etc/nginx/sites-available/pulse.conf)
# Routes subdomains cleanly to localhost ports without conflicting with other containers.

# 1. WebSocket Gateway (wss://ws.pulse.yourdomain.com)
server {
    listen 443 ssl http2;
    server_name ws.pulse.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/pulse.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulse.yourdomain.com/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:32001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts for persistent chat connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# 2. REST API & Auth (https://api.pulse.yourdomain.com)
server {
    listen 443 ssl http2;
    server_name api.pulse.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/pulse.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulse.yourdomain.com/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:32011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. HTTP to HTTPS Redirection
server {
    listen 80;
    server_name ws.pulse.yourdomain.com api.pulse.yourdomain.com;
    return 301 https://$host$request_uri;
}
